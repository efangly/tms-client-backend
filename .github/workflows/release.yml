# Builds tms-backend.exe and publishes a GitHub Release when a version tag
# is pushed. Running clients pick it up via internal/updater.
#
#   git tag v2.1.0 && git push origin v2.1.0
#
# Only plain vX.Y.Z tags become full releases that clients install; tags
# with a suffix (v2.1.0-rc1) are published as pre-releases and ignored by
# the updater.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./internal/...

      - name: Build
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          go build -trimpath \
            -ldflags="-s -w -H windowsgui -X tms-backend/internal/version.Version=$VERSION" \
            -o tms-backend.exe .
          sha256sum tms-backend.exe > checksums.txt
          cat checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes --title "$GITHUB_REF_NAME")
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" tms-backend.exe checksums.txt "${flags[@]}"
